# Netlify Configuration for BHA Electrical LLC

[build]
  # Build command - no build needed for static site
  command = "npm install"
  
  # Directory to deploy (static files)
  publish = "public"
  
  # Functions directory
  functions = "netlify/functions"

# Environment variables (set these in Netlify Dashboard or .env)
[env]
  [env.production]
    EMAIL_SERVICE = "gmail"
    # EMAIL_USER and EMAIL_PASSWORD must be set in Netlify Dashboard

# Redirect all non-existent pages to index.html (for SPA routing if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = "!req.url.match('^/api/') && !req.url.match('^/.netlify/')"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache headers for static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
